name: Importar site do ZIP

on:
  push:
    paths:
      - 'antes-do-primeiro-gole-site-atualizado.zip'
      - 'antes-do-primeiro-gole-site-github-pages.zip'
      - '.github/workflows/importar-site.yml'

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Escolher e extrair ZIP
        run: |
          ZIP='antes-do-primeiro-gole-site-github-pages.zip'
          if [ ! -f "$ZIP" ]; then
            ZIP='antes-do-primeiro-gole-site-atualizado.zip'
          fi
          rm -rf .site-temp
          mkdir .site-temp
          unzip -q "$ZIP" -d .site-temp
          SRC=$(find .site-temp -mindepth 1 -maxdepth 1 -type d | head -n 1)
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.site-temp' \
            ! -name 'antes-do-primeiro-gole-site-atualizado.zip' \
            ! -name 'antes-do-primeiro-gole-site-github-pages.zip' \
            -exec rm -rf {} +
          cp -a "$SRC"/. ./
          rm -rf .site-temp

      - name: Publicar versão corrigida
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publica versão corrigida para GitHub Pages' || exit 0
          git push
