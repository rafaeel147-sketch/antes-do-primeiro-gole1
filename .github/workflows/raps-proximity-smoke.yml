name: RAPS proximity browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'raps-no-bolso/**'
      - '.github/scripts/raps-proximity-smoke.mjs'
      - '.github/workflows/raps-proximity-smoke.yml'
  push:
    branches:
      - 'fix/raps-*'
    paths:
      - 'raps-no-bolso/**'
      - '.github/scripts/raps-proximity-smoke.mjs'
      - '.github/workflows/raps-proximity-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proximity-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe live CNES coordinate source (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          const resource = '7559175a-98ac-4719-bf30-5e6455ba57c5';
          const sql = `SELECT cnes, latitude, longitude, municipio FROM "${resource}" WHERE cnes='7304188'`;
          const url = 'https://dadosabertos.go.gov.br/pt_BR/api/3/action/datastore_search_sql?sql=' + encodeURIComponent(sql);
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 10000);
          try {
            const response = await fetch(url, { signal: controller.signal, headers: { accept: 'application/json' } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const payload = await response.json();
            const record = payload?.result?.records?.[0];
            const lat = Number(String(record?.latitude ?? '').replace(',', '.'));
            const lng = Number(String(record?.longitude ?? '').replace(',', '.'));
            if (!record || !Number.isFinite(lat) || !Number.isFinite(lng)) throw new Error('registro sem latitude/longitude válidas');
            console.log(`LIVE_GEO_SOURCE_OK CNES=${record.cnes} municipio=${record.municipio} lat=${lat} lng=${lng}`);
          } catch (error) {
            console.warn(`LIVE_GEO_SOURCE_WARN ${error?.message || error}`);
          } finally {
            clearTimeout(timeout);
          }
          NODE

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run proximity browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . >/tmp/raps-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/raps-no-bolso/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/raps-no-bolso/ >/dev/null
          node .github/scripts/raps-proximity-smoke.mjs
